name: Lint Pull Request

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  lint-pr:
    name: Lint PR Title
    permissions:
      contents: read
    uses: equinor/ops-actions/.github/workflows/commitlint.yml@dae4f55b517888e44a342a5f7d3dfac40580a127 # 9.44.0
    with:
      message: ${{ github.event.pull_request.title }}