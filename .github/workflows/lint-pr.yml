name: Lint Pull Request

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  lint-pr:
    name: Lint PR Title
    permissions:
      contents: read
    uses: equinor/ops-actions/.github/workflows/commitlint.yml@2198d70491e461c59dd3560b9ea10b1080d863c5 # 9.39.6
    with:
      message: ${{ github.event.pull_request.title }}