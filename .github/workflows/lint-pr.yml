name: Lint Pull Request

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  lint-pr:
    name: Lint PR Title
    permissions:
      contents: read
    uses: equinor/ops-actions/.github/workflows/commitlint.yml@2bcfd866433034d2106755d203635aeed68b6f6f # 9.40.0
    with:
      message: ${{ github.event.pull_request.title }}