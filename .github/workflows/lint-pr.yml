name: Lint Pull Request

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  lint-pr:
    name: Lint PR Title
    permissions:
      contents: read
    uses: equinor/ops-actions/.github/workflows/commitlint.yml@7e3b7a3ebdfe8bac700e5714e9bfd6b5b33ed6a9 # 9.41.1
    with:
      message: ${{ github.event.pull_request.title }}