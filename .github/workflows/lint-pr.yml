name: Lint Pull Request

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  lint-pr:
    name: Lint PR Title
    permissions:
      contents: read
    uses: equinor/ops-actions/.github/workflows/commitlint.yml@a98fb1dafcfb1acdeea610e70eb8c1a2be6b59cd # 9.39.2
    with:
      message: ${{ github.event.pull_request.title }}