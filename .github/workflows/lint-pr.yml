name: Lint Pull Request

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  lint-pr:
    name: Lint PR Title
    permissions:
      contents: read
    uses: equinor/ops-actions/.github/workflows/commitlint.yml@def1359ccd977da6f0720b22328ba6ac02b380ae # 9.43.2
    with:
      message: ${{ github.event.pull_request.title }}