name: Lint Pull Request

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  lint-pr:
    name: Lint PR Title
    permissions:
      contents: read
    uses: equinor/ops-actions/.github/workflows/commitlint.yml@9f888bd4522bcfaf0cce912c78507079dcd0fc27 # 9.44.1
    with:
      message: ${{ github.event.pull_request.title }}