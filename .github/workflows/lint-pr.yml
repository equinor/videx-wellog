name: Lint Pull Request

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions: {}

jobs:
  lint-pr:
    name: Lint PR Title
    permissions:
      contents: read
    uses: equinor/ops-actions/.github/workflows/commitlint.yml@b6bbac3dc7bafb364ff42042a24ecad1046e16c2 # 9.39.3
    with:
      message: ${{ github.event.pull_request.title }}