name: Run Node Tests with Code Coverage

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch: {}

permissions: {}

jobs:
  generate-test-results:
    name: Generate Test Results
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.14.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.0'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        id: test
        continue-on-error: true
        run: npm run coverage:ci

      - name: Strip DOCTYPE from coverage report
        if: ${{ always() }}
        run: sed -i '/<!DOCTYPE/d' coverage/Cobertura.xml 2>/dev/null || true

      - name: Upload Coverage Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event_name == 'push' && 'coverage-dev-baseline' || 'coverage' }}
          path: coverage/Cobertura.xml
          retention-days: ${{ github.event_name == 'push' && 90 || 5 }}
          if-no-files-found: warn

      - name: Upload Test Result Files
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results/junit.xml
          retention-days: 5
          if-no-files-found: warn

      - name: Fail job if tests failed
        if: ${{ always() && steps.test.outcome == 'failure' }}
        run: exit 1
